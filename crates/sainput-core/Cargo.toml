[package]
name = "sainput-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
cpal = "0.15"
serde_json = "1"
base64 = "0.22"

# Direct2D / DirectWrite：用于重写悬浮条（真圆角/真阴影）。
# 只开需要的特性，避免把整个 windows crate 拉进来。
windows = { version = "0.54", features = ["Win32_Foundation", "Foundation_Numerics", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
